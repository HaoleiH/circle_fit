[project]
name = "web-plot-rendering"
version = "0.1.0"
description = "Bright Feature Center & Circle Fitter application"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.0",
    "uvicorn>=0.52.0",
]
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
